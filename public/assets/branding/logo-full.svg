<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 48" width="380" height="48" fill="none">
  <g transform="translate(0,0)">
    
  <defs>
    <linearGradient id="earthGrad" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="orbitCyan" x1="0" y1="24" x2="48" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="emberGlow" x1="18" y1="16" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="55%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>
  <!-- Earth Core -->
  <circle cx="24" cy="24" r="16" fill="url(#earthGrad)" stroke="#334155" stroke-width="1.2"/>
  <!-- Latitude / Longitude Graticule -->
  <ellipse cx="24" cy="24" rx="16" ry="6.5" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1"/>
  <ellipse cx="24" cy="24" rx="7.5" ry="16" stroke="#38BDF8" stroke-opacity="0.28" stroke-width="1"/>
  <!-- Sun-Synchronous Orbital Ring 1 (MODIS) -->
  <ellipse cx="24" cy="24" rx="21.5" ry="8.5" transform="rotate(-32 24 24)" stroke="url(#orbitCyan)" stroke-width="1.75"/>
  <!-- Sun-Synchronous Orbital Ring 2 (VIIRS) -->
  <ellipse cx="24" cy="24" rx="21.5" ry="8.5" transform="rotate(38 24 24)" stroke="#F59E0B" stroke-width="1.6" stroke-dasharray="3 2"/>
  <!-- Central Active-Fire Radiative Node -->
  <circle cx="25.5" cy="23.5" r="4.8" fill="url(#emberGlow)"/>
  <circle cx="25.5" cy="23.5" r="7.5" stroke="#F97316" stroke-opacity="0.45" stroke-width="1.2"/>
  <!-- Satellite Nodes -->
  <circle cx="8.2" cy="14.5" r="2.5" fill="#38BDF8" stroke="#0F172A" stroke-width="1"/>
  <circle cx="39.5" cy="15.2" r="2.5" fill="#F59E0B" stroke="#0F172A" stroke-width="1"/>
  <circle cx="36.2" cy="36.8" r="2.2" fill="#A855F7" stroke="#0F172A" stroke-width="1"/>

  </g>
  <text x="58" y="21" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14.5" font-weight="800" letter-spacing="0.06em" fill="#0F172A">FIRMS CONSTELLATION</text>
  <text x="58" y="37" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="0.12em" fill="#EA580C">INTELLIGENCE · NASA CH08</text>
</svg>